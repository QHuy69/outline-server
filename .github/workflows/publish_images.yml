name: Publish multi-architecture Docker image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (defaults to latest)'
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/qhuy69/outline-server

jobs:
  build:
    name: Build ${{ matrix.docker_arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            docker_arch: amd64
          - target_arch: arm64
            docker_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install NPM dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Enable cross-platform Docker builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        env:
          DOCKER_BUILDKIT: '1'
          DOCKER_CONTENT_TRUST: '0'
          IMAGE_TAG: ${{ github.event.inputs.image_tag || (github.ref_type == 'tag' && github.ref_name || 'latest') }}
        run: |
          set -euo pipefail
          arch_tag="${IMAGE_TAG}-${{ matrix.docker_arch }}"
          TARGET_ARCH='${{ matrix.target_arch }}' \
            IMAGE_VERSION="${IMAGE_TAG}" \
            IMAGE_NAME="${IMAGE_NAME}:${arch_tag}" \
            ./task shadowbox:docker:build
          docker push "${IMAGE_NAME}:${arch_tag}"

  manifest:
    name: Publish multi-architecture manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify manifest
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          IMAGE_TAG: ${{ github.event.inputs.image_tag || (github.ref_type == 'tag' && github.ref_name || 'latest') }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-arm64"

          # A release tag is also the source for the installer’s rolling latest tag.
          if [[ "${IMAGE_TAG}" != 'latest' ]]; then
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:latest" \
              "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
              "${IMAGE_NAME}:${IMAGE_TAG}-arm64"
          fi

          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"

  smoke-test-installer:
    name: Smoke-test VPS installer
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install from the public installer
        run: |
          sudo bash ./install.sh \
            --hostname 127.0.0.1 \
            --api-port 8081 \
            --keys-port 9999

      - name: Clean up test containers
        if: always()
        run: |
          sudo docker rm --force shadowbox watchtower || true
